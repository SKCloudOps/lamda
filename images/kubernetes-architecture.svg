<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes cluster architecture</title>
  <desc id="desc">A control plane manages worker nodes that run application pods.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#1f5f8b"/></marker></defs>
  <rect width="1000" height="430" fill="#f5f7fa"/>
  <rect x="35" y="35" width="930" height="145" rx="16" fill="#eaf3f9" stroke="#1f5f8b" stroke-width="3"/>
  <text x="65" y="72" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1b3548">Control Plane</text>
  <g font-family="Arial,sans-serif" font-size="17" text-anchor="middle">
    <rect x="65" y="95" width="155" height="55" rx="9" fill="#fff" stroke="#8bb7cf"/><text x="142" y="129" fill="#17202a">API Server</text>
    <rect x="245" y="95" width="155" height="55" rx="9" fill="#fff" stroke="#8bb7cf"/><text x="322" y="129" fill="#17202a">etcd</text>
    <rect x="425" y="95" width="155" height="55" rx="9" fill="#fff" stroke="#8bb7cf"/><text x="502" y="129" fill="#17202a">Scheduler</text>
    <rect x="605" y="95" width="155" height="55" rx="9" fill="#fff" stroke="#8bb7cf"/><text x="682" y="129" fill="#17202a">Controllers</text>
    <rect x="785" y="95" width="155" height="55" rx="9" fill="#fff" stroke="#8bb7cf"/><text x="862" y="129" fill="#17202a">Cloud Provider</text>
  </g>
  <path d="M500 180 V230" stroke="#1f5f8b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="510" y="218" font-family="Arial,sans-serif" font-size="15" fill="#1f5f8b">desired state</text>
  <rect x="35" y="250" width="445" height="140" rx="16" fill="#edf8f2" stroke="#1f7a4d" stroke-width="3"/>
  <rect x="520" y="250" width="445" height="140" rx="16" fill="#edf8f2" stroke="#1f7a4d" stroke-width="3"/>
  <g font-family="Arial,sans-serif" fill="#17202a">
    <text x="65" y="285" font-size="22" font-weight="700">Worker Node A</text><text x="550" y="285" font-size="22" font-weight="700">Worker Node B</text>
    <text x="65" y="315" font-size="16">kubelet  •  containerd  •  kube-proxy</text><text x="550" y="315" font-size="16">kubelet  •  containerd  •  kube-proxy</text>
  </g>
  <g font-family="Arial,sans-serif" font-size="15" text-anchor="middle">
    <rect x="70" y="335" width="165" height="38" rx="7" fill="#fff" stroke="#8ac7a7"/><text x="152" y="359" fill="#17202a">Pod: web</text>
    <rect x="280" y="335" width="165" height="38" rx="7" fill="#fff" stroke="#8ac7a7"/><text x="362" y="359" fill="#17202a">Pod: api</text>
    <rect x="555" y="335" width="165" height="38" rx="7" fill="#fff" stroke="#8ac7a7"/><text x="637" y="359" fill="#17202a">Pod: worker</text>
    <rect x="765" y="335" width="165" height="38" rx="7" fill="#fff" stroke="#8ac7a7"/><text x="847" y="359" fill="#17202a">Pod: api</text>
  </g>
</svg>